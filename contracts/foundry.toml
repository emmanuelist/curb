[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Monad supports EIP-7702 and EIP-7951 (Pectra-era features), so Cancun opcodes are assumed.
# Unverified: confirm against docs.monad.xyz before the M2 mainnet deploy (docs/CONTEXT.md).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"

[fmt]
line_length = 110
